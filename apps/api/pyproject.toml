[project]
name = "angaza-api"
version = "0.1.0"
description = "AngazaBol — explainable football match intelligence"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "pydantic[email]==2.9.2",
  "pydantic-settings==2.5.2",
  "SQLAlchemy==2.0.35",
  "alembic==1.13.3",
  "python-jose[cryptography]==3.3.0",
  "argon2-cffi==23.1.0",
  "python-multipart==0.0.12",
  "httpx==0.27.2",
  "sse-starlette==2.1.3",
  "slowapi==0.1.9",
  "structlog==24.4.0",
  "psycopg[binary]==3.2.3",
]

[tool.vercel]
entrypoint = "index:app"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
  "E501",
  "B008",
  "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"app/tests/**" = ["F401", "F811"]
"alembic/**" = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
