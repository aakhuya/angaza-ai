[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
  "E501",   # line too long — handled by formatter conventions
  "B008",   # FastAPI Depends() in defaults is the correct pattern
  "SIM108", # ternaries aren't always clearer
]

[tool.ruff.lint.per-file-ignores]
"app/tests/**" = ["F401", "F811"]
"alembic/**" = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["app/tests"]
